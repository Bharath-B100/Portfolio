<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <style>
        /* Shared Styles for Certifications Page */
        body { padding-top: 80px; }
        .cert-hero { 
            padding: 100px 0 60px; 
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.05) 0%, transparent 60%);
        }
        .dark-mode .cert-hero { background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, transparent 60%); }
        .cert-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--text-light) 0%, var(--text-muted-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dark-mode .cert-title {
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cert-meta { color: var(--primary-color); font-weight: 600; font-size: 1.1rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
            padding-bottom: 80px;
        }
        .cert-card {
            background: transparent;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .dark-mode .cert-card {
            border-color: var(--border-dark);
        }
        .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .cert-card img {
            width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            object-fit: contain;
            max-height: 400px;
            transition: transform 0.3s ease;
            -webkit-user-drag: none;
            user-select: none;
        }
        .cert-card:hover img {
            transform: scale(1.02);
        }
        
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted-light); text-decoration: none; font-weight: 500; margin-bottom: 40px; transition: var(--transition-fast); }
        .dark-mode .back-link { color: var(--text-muted-dark); }
        .back-link:hover { color: var(--primary-color); transform: translateX(-5px); }

        /* Lightbox Styles */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(8px);
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            object-fit: contain;
        }
        .lightbox.active .lightbox-content {
            transform: scale(1);
        }
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            z-index: 10;
            line-height: 1;
        }
        .lightbox-close:hover {
            color: #bbb;
            transform: scale(1.1);
        }
        .cert-card {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Page Transition Overlay -->

    <nav id="navbar" class="scrolled">
        <div class="container nav-container">
            <a href="index.html#home" class="logo">Bharath <span>Raj B</span></a>
            <ul class="nav-menu">
                <li><a href="index.html#about">Back to About</a></li>

    <main class="container">
        <div class="cert-hero scale-in">

            <div class="cert-card"><img src="assets/images/Certifications/IITH-Vishwakarma.jpg" alt="IITH Vishwakarma" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/CIT.png" alt="CIT Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 142541.png" alt="Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 142558.png" alt="Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 142612.png" alt="Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 143058.png" alt="Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 143612.png" alt="Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 174048.png" alt="Certification" loading="lazy"></div>
            <div class="cert-card"><img src="assets/images/Certifications/Screenshot 2026-06-29 174151.png" alt="Certification" loading="lazy"></div>

    <footer>

            <p style="margin: 0;">&copy; <span id="currentYear">2026</span> Bharath Raj B. All Rights Reserved.</p>

                <span class="sig-prefix">with love</span>

        </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img src="" alt="Certificate Full View" class="lightbox-content" id="lightbox-img">
    </div>

    <!-- Scripts -->
    <script src="scripts/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); }
            const fadeElements = document.querySelectorAll('.fade-up, .scale-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            fadeElements.forEach(el => observer.observe(el));

            // Lightbox functionality
            const certCards = document.querySelectorAll('.cert-card img');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');
            
            lightboxImg.setAttribute('draggable', 'false');

            certCards.forEach(img => {
                img.setAttribute('draggable', 'false');
                img.addEventListener('click', () => {
                    lightboxImg.src = img.src;
                    lightbox.classList.add('active');
                });
            });

            lightboxClose.addEventListener('click', () => {
                lightbox.classList.remove('active');
            });

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    lightbox.classList.remove('active');
                }
            });
            
            // Close on escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    lightbox.classList.remove('active');
                }
            });
        });
    </script>
</body>
